<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile & Settings | Desi Dine</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer" style="z-index: 1080"></div>

  <nav class="navbar navbar-expand-lg navbar-dd sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-egg-fried me-1"></i>Desi Dine</a>
      <div class="d-flex align-items-center gap-3 ms-auto">
        <button class="btn btn-sm btn-outline-light" id="themeToggleBtn" type="button">
          <i class="bi bi-moon-stars"></i> Dark Mode
        </button>
        <button class="btn btn-sm btn-outline-light" onclick="window.location.href='index.html'">
          <i class="bi bi-house-door"></i> Home
        </button>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="settings-card p-4 p-md-5">
          <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
              <h2 class="mb-1 text-dd-green">Profile & Settings</h2>
              <p class="text-muted mb-0">Manage your account preferences.</p>
            </div>
            <button class="btn btn-dd-primary" onclick="logoutUser()">
              <i class="bi bi-box-arrow-right me-1"></i> Logout
            </button>
          </div>

          <div class="row g-4">
            <div class="col-md-6">
              <div class="profile-card p-4 h-100">
                <div class="text-center mb-3">
                  <div class="rounded-circle bg-success-subtle d-inline-flex align-items-center justify-content-center" style="width: 72px; height: 72px; font-size: 2rem;">
                    <i class="bi bi-person-circle text-dd-green"></i>
                  </div>
                </div>
                <h5 class="text-center mb-1" id="profileName">Loading...</h5>
                <p class="text-center text-muted mb-0" id="profileEmail">Loading...</p>
              </div>
            </div>

            <div class="col-md-6">
              <div class="profile-card p-4 h-100">
                <h5 class="text-dd-green">Preferences</h5>
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <span>Theme</span>
                  <button id="themeSwitchBtn" class="btn btn-sm btn-outline-secondary" type="button">Switch mode</button>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <span>Role</span>
                  <span id="profileRole" class="badge text-bg-success">Customer</span>
                </div>
                <div class="d-flex justify-content-between align-items-center">
                  <span>Admin dashboard</span>
                  <a href="admin.html" id="adminLink" class="btn btn-sm btn-dd-primary d-none">Open</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function applyTheme(theme) {
      const root = document.documentElement;
      const body = document.body;
      const resolved = theme === 'dark' ? 'dark' : 'light';
      root.setAttribute('data-theme', resolved);
      body.setAttribute('data-theme', resolved);
      localStorage.setItem('desidine-theme', resolved);
      const button = document.getElementById('themeToggleBtn');
      const switchBtn = document.getElementById('themeSwitchBtn');
      const isDark = resolved === 'dark';
      if (button) {
        button.innerHTML = isDark ? '<i class="bi bi-sun"></i> Light Mode' : '<i class="bi bi-moon-stars"></i> Dark Mode';
      }
      if (switchBtn) {
        switchBtn.textContent = isDark ? 'Light mode' : 'Dark mode';
      }
    }

    function initTheme() {
      const savedTheme = localStorage.getItem('desidine-theme') || 'light';
      applyTheme(savedTheme);
      document.getElementById('themeToggleBtn')?.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(current);
      });
      document.getElementById('themeSwitchBtn')?.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(current);
      });
    }

    (async function () {
      const user = await getCurrentUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      const profile = await getProfile(user.id);
      const nameEl = document.getElementById('profileName');
      const emailEl = document.getElementById('profileEmail');
      const roleEl = document.getElementById('profileRole');
      const adminLink = document.getElementById('adminLink');

      nameEl.textContent = profile?.full_name || user.email?.split('@')[0] || 'Customer';
      emailEl.textContent = user.email || 'No email';
      roleEl.textContent = profile?.role === 'admin' ? 'Admin' : 'Customer';
      roleEl.className = profile?.role === 'admin' ? 'badge text-bg-success' : 'badge text-bg-secondary';
      if (profile?.role === 'admin') {
        adminLink.classList.remove('d-none');
      }

      initTheme();
    })();
  </script>
</body>
</html>
