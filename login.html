<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Desi Dine</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer" style="z-index: 1080"></div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center mb-4">
        <i class="bi bi-egg-fried fs-1 text-dd-gold"></i>
        <h2 class="mt-2 mb-0 brand-font">Desi Dine</h2>
        <p class="text-muted small">Sign in to your account</p>
      </div>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Email address</label>
          <input type="email" class="form-control" id="loginEmail" required placeholder="you@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="loginPassword" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-dd-primary w-100 py-2" id="loginBtn">
          Sign In
        </button>
      </form>

      <p class="text-center mt-4 mb-0 small">
        Don't have an account? <a href="register.html" class="text-dd-green fw-semibold">Create one</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // If already logged in, skip straight to the app.
    (async () => {
      const user = await getCurrentUser();
      if (user) {
        const profile = await getProfile(user.id);
        window.location.href = profile?.role === "admin" ? "admin.html" : "index.html";
      }
    })();

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Signing in...`;

      try {
        const data = await loginUser(email, password);
        const profile = await getProfile(data.user.id);
        showToast("Welcome back!", "success");
        setTimeout(() => {
          window.location.href = profile?.role === "admin" ? "admin.html" : "index.html";
        }, 600);
      } catch (err) {
        console.error(err);
        showToast(err.message || "Login failed. Check your credentials.", "error");
        btn.disabled = false;
        btn.innerHTML = "Sign In";
      }
    });
  </script>
</body>
</html>
