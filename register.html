<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account | Desi Dine</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer" style="z-index: 1080"></div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center mb-4">
        <i class="bi bi-egg-fried fs-1 text-dd-gold"></i>
        <h2 class="mt-2 mb-0 brand-font">Desi Dine</h2>
        <p class="text-muted small">Create your account</p>
      </div>

      <form id="registerForm">
        <div class="mb-3">
          <label class="form-label">Full name</label>
          <input type="text" class="form-control" id="regName" required placeholder="Ali Khan">
        </div>
        <div class="mb-3">
          <label class="form-label">Email address</label>
          <input type="email" class="form-control" id="regEmail" required placeholder="you@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="regPassword" required minlength="6" placeholder="At least 6 characters">
        </div>
        <button type="submit" class="btn btn-dd-primary w-100 py-2" id="registerBtn">
          Create Account
        </button>
      </form>

      <p class="text-center mt-4 mb-0 small">
        Already have an account? <a href="login.html" class="text-dd-green fw-semibold">Sign in</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("registerBtn");
      const fullName = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value;

      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Creating account...`;

      try {
        await registerUser(fullName, email, password);
        showToast("Account created! Please sign in.", "success");
        setTimeout(() => (window.location.href = "login.html"), 1000);
      } catch (err) {
        console.error(err);
        showToast(err.message || "Registration failed.", "error");
        btn.disabled = false;
        btn.innerHTML = "Create Account";
      }
    });
  </script>
</body>
</html>
